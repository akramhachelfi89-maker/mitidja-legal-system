<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الشؤون القانونية - أشبال متيجة</title>
    <link rel="icon" href="logo1.jpeg" type="image/jpeg">
    <link rel="apple-touch-icon" href="logo1.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        @media print { 
            body { background-color: white; } 
            #sidebar, #topbar, .no-print { display: none !important; } 
            #main-content { margin: 0 !important; padding: 0 !important; width: 100% !important; } 
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- شاشة الدخول (مع عرض القوانين في الخلفية) -->
    <div id="login-screen" class="flex h-screen bg-gray-100 overflow-hidden w-full">
        <!-- الجزء الأيمن: القوانين والبحث -->
        <div class="hidden md:flex flex-col w-2/3 bg-white p-8 overflow-y-auto shadow-inner relative">
            <div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: url('logo1.jpeg'); background-size: contain; background-position: center; background-repeat: no-repeat;"></div>
            
            <div class="relative z-10 mb-8 flex justify-between items-center border-b pb-4">
                <h2 class="text-3xl font-black text-blue-900"><i class="fas fa-scale-balanced mr-2"></i> المرجع القانوني السريع</h2>
                <div class="relative w-72">
                    <input type="text" id="publicSearch" onkeyup="searchPublicLaws()" placeholder="ابحث في القوانين..." class="w-full px-4 py-2 border-2 border-blue-200 rounded-full focus:outline-none focus:border-blue-600 bg-gray-50">
                    <i class="fas fa-search absolute left-4 top-3 text-gray-400"></i>
                </div>
            </div>

            <div id="public-laws-container" class="relative z-10 grid grid-cols-1 gap-6">
                <p class="text-gray-500 text-center animate-pulse font-bold mt-10">جاري تحميل النصوص القانونية...</p>
            </div>
        </div>

        <!-- الجزء الأيسر: نموذج تسجيل الدخول -->
        <div class="w-full md:w-1/3 bg-blue-900 text-white flex flex-col justify-center items-center p-8 shadow-2xl relative">
            <div class="bg-white text-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-sm relative z-10">
                <div class="text-center mb-6">
                    <img src="logo1.jpeg" class="w-20 h-20 mx-auto rounded-full border-4 border-gray-100 shadow-sm mb-3">
                    <h1 class="text-2xl font-black text-blue-900">أشبال متيجة</h1>
                    <p class="text-xs font-bold text-gray-500 mt-1">نظام إدارة الشؤون القانونية والمنازعات</p>
                </div>
                
                <form onsubmit="handleLogin(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-bold mb-2 text-gray-700">اسم المستخدم</label>
                        <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900 bg-gray-50 text-left" dir="ltr" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-bold mb-2 text-gray-700">كلمة المرور</label>
                        <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900 bg-gray-50 text-left" dir="ltr" required>
                    </div>
                    <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-lg transition shadow-md">
                        دخول للنظام <i class="fas fa-arrow-left ml-2"></i>
                    </button>
                    <div id="login-error" class="hidden mt-4 bg-red-100 text-red-700 p-2 rounded text-sm text-center font-bold"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم (الرئيسية) -->
    <div id="dashboard-screen" class="hidden flex h-screen overflow-hidden">
        <aside id="sidebar" class="w-64 bg-blue-900 text-white flex flex-col z-20">
            <div class="p-4 text-center border-b border-blue-800">
                <h3 class="font-bold text-lg">أشبال متيجة</h3><p id="user-role-display" class="text-sm mt-1 text-yellow-400 font-bold"></p>
            </div>
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto" id="nav-links"></nav>
            <div class="p-4 border-t border-blue-800"><button onclick="logout()" class="w-full bg-red-600 hover:bg-red-700 font-bold text-white py-2 rounded transition">تسجيل الخروج</button></div>
        </aside>

        <main class="flex-1 flex flex-col h-screen relative">
            <header id="topbar" class="bg-white shadow px-6 py-4 flex justify-between items-center z-10">
                <h2 id="page-title" class="text-xl font-bold text-gray-800">الرئيسية</h2>
                <div class="flex items-center gap-4">
                    <!-- جرس الإشعارات -->
                    <div id="notification-bell" class="relative cursor-pointer hidden text-gray-600 hover:text-blue-900 transition">
                        <i class="fas fa-bell text-2xl"></i>
                        <span id="notif-count" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs font-bold px-1.5 py-0.5 rounded-full shadow-lg hidden">0</span>
                    </div>
                    <div id="user-name-display" class="font-bold text-blue-900 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100"></div>
                </div>
            </header>

            <div id="main-content" class="p-6 flex-1 overflow-y-auto bg-gray-50">
                
                <!-- الإحصائيات -->
                <div id="view-dashboard" class="view-section mb-6">
                    <h3 class="text-lg font-bold mb-4"><i class="fas fa-chart-pie text-blue-600 ml-2"></i>
